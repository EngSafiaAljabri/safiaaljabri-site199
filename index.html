<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>University Facility Issue Report</title>

    <!-- Google Font Tajawal -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        /* خلفية الصفحة */
        body {
            font-family: 'Tajawal', Arial, sans-serif;
            background: url('img/cam.jpeg') no-repeat center center fixed;
            background-size: cover;
            padding: 40px;
            margin: 0;
        }

        /* صندوق الفورم */
        .form-box {
            background: rgba(255,255,255,0.95);
            padding: 30px;
            max-width: 500px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }

        /* صورة أعلى الفورم */
        .form-box img {
            display: block;
            max-width: 200px;
            margin: 0 auto 20px auto;
        }

        /* العناوين */
        h1, h3 {
            text-align: center;
            font-weight: 600;
        }

        /* الحقول */
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-family: 'Tajawal', Arial, sans-serif;
            font-size: 14px;
        }

        /* زر الإرسال */
        button {
            background: #0066cc;
            color: white;
            padding: 12px;
            border: none;
            width: 100%;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
            font-family: 'Tajawal', Arial, sans-serif;
        }

        button:hover {
            background: #004999;
        }

        /* رسالة النجاح */
        #msg {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>
<body>

    <div class="form-box">

        <!-- صورة الشعار أعلى الفورم -->
        <img src="img/الجامعه.png" alt="University Logo"/>

        <h1>Estates & Campus Services</h1>
        <h3>Report Facility Issue</h3>

        <form id="issueForm" enctype="multipart/form-data">

            <label>Issue Type</label>
            <select name="type" required>
                <option value="">Select</option>
                <option value="Maintenance">Maintenance</option>
                <option value="Electrical / Lighting">Electrical / Lighting</option>
                <option value="Air Conditioning">Air Conditioning</option>
                <option value="Furniture / Doors">Furniture / Doors</option>
                <option value="Cleaning">Cleaning</option>
                <option value="Safety Hazard">Safety Hazard</option>
                <option value="Other">Other</option>
            </select>

            <label>Building</label>
            <select name="building" required>
                <option value="">Select</option>
                <option value="Main Hall">Main Hall</option>
                <option value="Library">Library</option>
                <option value="Labs">Labs</option>
                <option value="Cafeteria">Cafeteria</option>
                <option value="Admin Block">Admin Block</option>
                <option value="Sports Complex">Sports Complex</option>
                <option value="Auditorium">Auditorium</option>
                <option value="Parking Area">Parking Area</option>
            </select>

            <label>Location</label>
            <input type="text" name="location" required>

            <label>Description</label>
            <textarea name="description" rows="4" required></textarea>

            <label>Upload Photo</label>
            <input type="file" name="photo">

            <label>Priority</label>
            <select name="priority" required>
                <option value="">Select</option>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
                <option value="Urgent">Urgent</option>
            </select>

            <label>Name (Optional)</label>
            <input type="text" name="reporter">

            <label>Email (Optional)</label>
            <input type="email" name="email">

            <button type="submit">Submit Report</button>
        </form>

        <div id="msg"></div>

    </div>

    <script>
        document.getElementById("issueForm").addEventListener("submit", function (e) {
            e.preventDefault();
            var formData = new FormData(this);

            fetch("/submit-report", {
                method: "POST",
                body: formData
            })
            .then(res => res.text())
            .then(data => {
                document.getElementById("msg").innerText = "Report submitted successfully!";
                this.reset();
            })
            .catch(err => {
                document.getElementById("msg").innerText = "Error submitting report.";
            });
        });
    </script>

</body>
</html>
